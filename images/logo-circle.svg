<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Theme Background Disc -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Outer Deep Black Disc -->
  <circle cx="250" cy="250" r="238" fill="url(#discGrad)" />
  <circle cx="250" cy="250" r="238" fill="none" stroke="#ffffff" stroke-width="4" />

  <!-- V60 Manual Brew Dripper Icon (Optically Centered) -->
  <g transform="translate(232, 252)">
    <!-- Top Rim Bar -->
    <line x1="-118" y1="-94" x2="118" y2="-94" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />

    <!-- V60 Cone Body (Trapezoid) -->
    <polygon points="-112,-94 112,-94 40,62 -40,62" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />

    <!-- 3 Horizontal Rib Lines -->
    <line x1="-94" y1="-53" x2="94" y2="-53" stroke="#ffffff" stroke-width="13" stroke-linecap="round" />
    <line x1="-74" y1="-14" x2="74" y2="-14" stroke="#ffffff" stroke-width="13" stroke-linecap="round" />
    <line x1="-54" y1="25" x2="54" y2="25" stroke="#ffffff" stroke-width="13" stroke-linecap="round" />

    <!-- Base Resting Plate -->
    <line x1="-70" y1="80" x2="70" y2="80" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

    <!-- Base Collar Spout Lines -->
    <line x1="-24" y1="62" x2="-24" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="24" y1="62" x2="24" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

    <!-- Dripper Handle on Right -->
    <path d="M 102,-68 C 182,-54 178,31 54,44" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
